[package]
name = "ip-checker"
version = "1.1.0"
edition = "2024"
build = "src/build_script.rs"

[dependencies]
async-signal = "0.2.14"
axum = "0.8.9"
base64 = "0.23.1"
cidr = "0.3.2"
cloneable_errors = "2.3.0"
futures-lite = "2.6.1"
html-escape = "0.2.13"
indexmap = { version = "2.14.1", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false }
rustls-webpki = "0.103.15"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "parking_lot", "io-util"] }
tokio-rustls = "0.26.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webpki-roots = "1.0.9"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
option_if_let_else = "allow"
todo = "warn"

[profile.release]
strip = true
lto = "thin"

[build-dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["std", "clock"] }
cloneable_errors = "2.3.0"
