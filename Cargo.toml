[package]
name = "ip-checker"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
cidr = "0.3.2"
cloneable_errors = "2.3.0"
html-escape = "0.2.13"
indexmap = { version = "2.14.0", features = ["serde"] }
rustls-webpki = "0.103.13"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["rt-multi-thread", "net", "macros", "parking_lot", "io-util"] }
tokio-rustls = "0.26.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webpki-roots = "1.0.7"
